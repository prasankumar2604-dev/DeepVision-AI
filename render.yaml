services:
  - type: web
    name: deepvision-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUTF8
        value: 1
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: true
