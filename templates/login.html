{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">

  <div class="login-card">

    <div class="auth-header">
      <div class="auth-brand-emblem">
        <div class="emblem-core"></div>
      </div>
      <h1>Welcome <span>Back</span></h1>
      <p>
        Sign in to access your <strong>DeepVision AI</strong> detection workspace.
      </p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">

      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <input
          type="email"
          id="loginEmail"
          name="email"
          placeholder="name@company.com"
          autocomplete="email"
          required>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="password-input-wrapper">
          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
          <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary login-btn">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>Sign In to Workspace</span>
      </button>

    </form>

    <div class="login-footer">
      <span>Don't have an account yet?</span>
      <a href="{{ url_for('signup') }}">Create Account</a>
    </div>

  </div>

</div>
{% endblock %}
