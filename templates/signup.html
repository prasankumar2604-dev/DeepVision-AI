{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">

  <div class="login-card">

    <div class="auth-header">
      <div class="auth-brand-emblem">
        <div class="emblem-core"></div>
      </div>
      <h1>Create <span>Account</span></h1>
      <p>
        Join <strong>DeepVision AI</strong> and start detecting deepfake images.
      </p>
    </div>

    <form method="POST" action="{{ url_for('signup') }}">

      <div class="input-group">
        <label for="signupUsername">Username</label>
        <input
          type="text"
          id="signupUsername"
          name="username"
          placeholder="e.g. AlexMorgan"
          autocomplete="username"
          required>
      </div>

      <div class="input-group">
        <label for="signupEmail">Email Address</label>
        <input
          type="email"
          id="signupEmail"
          name="email"
          placeholder="name@company.com"
          autocomplete="email"
          required>
      </div>

      <div class="input-group">
        <label for="signupPassword">Password</label>
        <div class="password-input-wrapper">
          <input
            type="password"
            id="signupPassword"
            name="password"
            placeholder="Create a secure password"
            autocomplete="new-password"
            required>
          <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary login-btn">
        <i class="fa-solid fa-user-plus"></i>
        <span>Create Account</span>
      </button>

    </form>

    <div class="login-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('login') }}">Sign In Here</a>
    </div>

  </div>

</div>
{% endblock %}
