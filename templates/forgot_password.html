{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">

  <div class="login-card">

    <div class="auth-header">
      <div class="auth-brand-emblem">
        <div class="emblem-core"></div>
      </div>
      <h1>Reset <span>Password</span></h1>
      <p>
        Enter your registered email address. We'll dispatch a secure, single-use link to reset your password.
      </p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="input-group">
        <label for="resetEmail">Registered Email Address</label>
        <input
          type="email"
          id="resetEmail"
          name="email"
          placeholder="name@company.com"
          autocomplete="email"
          required
          autofocus>
      </div>

      <button type="submit" class="btn-primary login-btn">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Send Reset Link</span>
      </button>

    </form>

    <div class="login-footer">
      <span>Remember your credentials?</span>
      <a href="{{ url_for('login') }}">Return to Sign In</a>
    </div>

  </div>

</div>
{% endblock %}
