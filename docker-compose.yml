# ==========================================================
# DeepVision AI — Docker Compose Configuration
# Production-ready container orchestration with persistent volumes
# ==========================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepvision-app
    image: deepvision-ai:latest
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # Application Security
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-deepvision_production_secret_key_luxury_gold_2026}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - PORT=5000
      - PYTHONUTF8=1
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5000}

      # SMTP Email Configuration (Passed through from .env or container environment)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - MAIL_FROM=${MAIL_FROM:-}
    volumes:
      # Persistent SQLite database volume to survive container recreation
      - deepvision_db:/app/database
      # Persistent uploaded images volume
      - deepvision_uploads:/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  deepvision_db:
    name: deepvision_db_volume
  deepvision_uploads:
    name: deepvision_uploads_volume
